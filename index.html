<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External.net</title>
</head>

<body>

    <div class="header">
        <div class="left">External.net</div>
        <div class="right">44devs</div>
    </div>

    <div class="line"></div>

    <div class="scripts">Scripts</div>

    <div class="apps">

        <div class="app-box">
            <div class="app-title">VizLock</div>
            <button class="recive-btn"
                onclick="copyUrl('!Serv.Load = &quot;https://pastefy.app/RUi5Y136/raw&quot;')">
                Recive
            </button>
        </div>

        <div class="app-box">
            <div class="app-title">Catowl Icon</div>
            <button class="recive-btn"
                onclick="copyUrl('!Serv.Load = &quot;https://pastefy.app/6e0TjtO4/raw&quot;')">
                Recive
            </button>
        </div>

    </div>

    <div class="section-line"></div>

    <div class="scripts lua-title">
        <span class="lua-icon">Luau</span>
        LuaU Scripts / Roblox
    </div>

    <div class="apps">

        <div class="app-box lua-box">

            <div class="lua-icon-big">Luau</div>

            <div class="app-title">
                Better Leaderboard on F2
            </div>

            <div class="app-desc">
                Custom Roblox player list with avatars,
                scrolling and clickable player information.
            </div>

            <div class="badges">
                <span class="verified">[☑]</span>
                <span class="developer">[⚒]</span>
            </div>

            <button class="recive-btn" onclick="copyUrl(leaderboardScript)">
                Recive
            </button>

        </div>

    </div>

    <div id="toast">
        <div class="toast-title">Code Recived</div>
        <div class="toast-desc">Paste The Copied RL In The Executor</div>
    </div>

<script>

const leaderboardScript = `local Players = game:GetService("Players")
local UserInputService = game:GetService("UserInputService")
local TweenService = game:GetService("TweenService")
local StarterGui = game:GetService("StarterGui")

local me = Players.LocalPlayer
local gui = me:WaitForChild("PlayerGui")

pcall(function()
	StarterGui:SetCoreGuiEnabled(Enum.CoreGuiType.PlayerList, false)
end)

local verified = {
	[859516] = true
}

local developers = {
	[859516] = true
}

local screen = Instance.new("ScreenGui")
screen.Name = "PlayerList"
screen.ResetOnSpawn = false
screen.IgnoreGuiInset = true
screen.Parent = gui

local main = Instance.new("Frame")
main.Size = UDim2.new(0, 430, 0, 460)
main.Position = UDim2.new(1, 20, 0, 20)
main.BackgroundColor3 = Color3.fromRGB(18, 18, 23)
main.BackgroundTransparency = 0.05
main.BorderSizePixel = 0
main.Visible = false
main.Parent = screen

local corner = Instance.new("UICorner")
corner.CornerRadius = UDim.new(0, 12)
corner.Parent = main

local stroke = Instance.new("UIStroke")
stroke.Color = Color3.fromRGB(65, 65, 75)
stroke.Transparency = 0.2
stroke.Parent = main

local title = Instance.new("TextLabel")
title.Size = UDim2.new(1, -60, 0, 45)
title.Position = UDim2.new(0, 15, 0, 8)
title.BackgroundTransparency = 1
title.TextColor3 = Color3.fromRGB(255, 255, 255)
title.TextSize = 22
title.Font = Enum.Font.GothamBold
title.TextXAlignment = Enum.TextXAlignment.Left
title.Parent = main

local close = Instance.new("TextButton")
close.Size = UDim2.new(0, 35, 0, 35)
close.Position = UDim2.new(1, -45, 0, 10)
close.BackgroundColor3 = Color3.fromRGB(35, 35, 42)
close.Text = "×"
close.TextColor3 = Color3.fromRGB(220, 220, 220)
close.TextSize = 25
close.Font = Enum.Font.GothamBold
close.BorderSizePixel = 0
close.Parent = main

local closeCorner = Instance.new("UICorner")
closeCorner.CornerRadius = UDim.new(0, 8)
closeCorner.Parent = close

local scroll = Instance.new("ScrollingFrame")
scroll.Size = UDim2.new(1, -20, 1, -65)
scroll.Position = UDim2.new(0, 10, 0, 58)
scroll.BackgroundTransparency = 1
scroll.BorderSizePixel = 0
scroll.ScrollBarThickness = 5
scroll.ScrollBarImageColor3 = Color3.fromRGB(100, 100, 110)
scroll.AutomaticCanvasSize = Enum.AutomaticSize.Y
scroll.CanvasSize = UDim2.new()
scroll.Parent = main

local layout = Instance.new("UIListLayout")
layout.Padding = UDim.new(0, 8)
layout.SortOrder = Enum.SortOrder.Name
layout.Parent = scroll

local padding = Instance.new("UIPadding")
padding.PaddingBottom = UDim.new(0, 10)
padding.Parent = scroll

local popup = Instance.new("Frame")
popup.Size = UDim2.new(1, 0, 1, 0)
popup.BackgroundColor3 = Color3.fromRGB(0, 0, 0)
popup.BackgroundTransparency = 1
popup.Visible = false
popup.ZIndex = 20
popup.Parent = screen

local box = Instance.new("Frame")
box.Size = UDim2.new(0, 360, 0, 170)
box.Position = UDim2.new(0.5, -180, 0.5, -85)
box.BackgroundColor3 = Color3.fromRGB(22, 22, 28)
box.BorderSizePixel = 0
box.ZIndex = 21
box.Parent = popup

local boxCorner = Instance.new("UICorner")
boxCorner.CornerRadius = UDim.new(0, 12)
boxCorner.Parent = box

local boxStroke = Instance.new("UIStroke")
boxStroke.Color = Color3.fromRGB(70, 70, 80)
boxStroke.Parent = box

local boxTitle = Instance.new("TextLabel")
boxTitle.Size = UDim2.new(1, -60, 0, 30)
boxTitle.Position = UDim2.new(0, 15, 0, 12)
boxTitle.BackgroundTransparency = 1
boxTitle.TextColor3 = Color3.fromRGB(255, 255, 255)
boxTitle.TextSize = 18
boxTitle.Font = Enum.Font.GothamBold
boxTitle.TextXAlignment = Enum.TextXAlignment.Left
boxTitle.ZIndex = 22
boxTitle.Parent = box

local input = Instance.new("TextBox")
input.Size = UDim2.new(1, -30, 0, 45)
input.Position = UDim2.new(0, 15, 0, 55)
input.BackgroundColor3 = Color3.fromRGB(32, 32, 40)
input.TextColor3 = Color3.fromRGB(255, 255, 255)
input.TextSize = 16
input.Font = Enum.Font.Gotham
input.ClearTextOnFocus = false
input.TextEditable = true
input.BorderSizePixel = 0
input.ZIndex = 22
input.Parent = box

local inputCorner = Instance.new("UICorner")
inputCorner.CornerRadius = UDim.new(0, 7)
inputCorner.Parent = input

local hint = Instance.new("TextLabel")
hint.Size = UDim2.new(1, -30, 0, 25)
hint.Position = UDim2.new(0, 15, 0, 110)
hint.BackgroundTransparency = 1
hint.Text = "Ctrl+C to copy"
hint.TextColor3 = Color3.fromRGB(150, 150, 160)
hint.TextSize = 12
hint.Font = Enum.Font.Gotham
hint.TextXAlignment = Enum.TextXAlignment.Left
hint.ZIndex = 22
hint.Parent = box

local popupClose = Instance.new("TextButton")
popupClose.Size = UDim2.new(0, 30, 0, 30)
popupClose.Position = UDim2.new(1, -42, 0, 10)
popupClose.BackgroundTransparency = 1
popupClose.Text = "×"
popupClose.TextColor3 = Color3.fromRGB(200, 200, 200)
popupClose.TextSize = 23
popupClose.Font = Enum.Font.GothamBold
popupClose.ZIndex = 22
popupClose.Parent = box

local function closePopup()
	local t = TweenService:Create(
		box,
		TweenInfo.new(0.12, Enum.EasingStyle.Quad, Enum.EasingDirection.In),
		{
			Size = UDim2.new(0, 330, 0, 150),
			Position = UDim2.new(0.5, -165, 0.5, -75)
		}
	)

	TweenService:Create(
		popup,
		TweenInfo.new(0.12),
		{
			BackgroundTransparency = 1
		}
	):Play()

	t:Play()

	t.Completed:Once(function()
		popup.Visible = false
		input:ReleaseFocus()
	end)
end

local function showPopup(value, name)
	popup.Visible = true
	popup.BackgroundTransparency = 1

	box.Size = UDim2.new(0, 340, 0, 155)
	box.Position = UDim2.new(0.5, -170, 0.5, -70)

	boxTitle.Text = "Copy " .. name
	input.Text = tostring(value)

	TweenService:Create(
		popup,
		TweenInfo.new(0.15),
		{
			BackgroundTransparency = 0.45
		}
	):Play()

	TweenService:Create(
		box,
		TweenInfo.new(0.18, Enum.EasingStyle.Back, Enum.EasingDirection.Out),
		{
			Size = UDim2.new(0, 360, 0, 170),
			Position = UDim2.new(0.5, -180, 0.5, -85)
		}
	):Play()

	task.delay(0.08, function()
		input:CaptureFocus()
		input.SelectionStart = 1
		input.CursorPosition = #input.Text + 1
	end)
end

popupClose.MouseButton1Click:Connect(closePopup)

local function clickable(parent, text, pos, size, textSize, label)
	local button = Instance.new("TextButton")
	button.Size = size
	button.Position = pos
	button.BackgroundTransparency = 1
	button.Text = text
	button.TextColor3 = Color3.fromRGB(225, 225, 230)
	button.TextSize = textSize
	button.Font = Enum.Font.Gotham
	button.TextXAlignment = Enum.TextXAlignment.Left
	button.AutoButtonColor = false
	button.Parent = parent

	button.MouseEnter:Connect(function()
		TweenService:Create(
			button,
			TweenInfo.new(0.1),
			{
				TextColor3 = Color3.fromRGB(90, 170, 255)
			}
		):Play()
	end)

	button.MouseLeave:Connect(function()
		TweenService:Create(
			button,
			TweenInfo.new(0.1),
			{
				TextColor3 = Color3.fromRGB(225, 225, 230)
			}
		):Play()
	end)

	button.MouseButton1Click:Connect(function()
		showPopup(text, label)
	end)
end

local function badge(parent, text, color, pos)
	local b = Instance.new("TextLabel")
	b.Size = UDim2.new(0, 35, 0, 22)
	b.Position = pos
	b.BackgroundTransparency = 1
	b.Text = text
	b.TextColor3 = color
	b.TextSize = 13
	b.Font = Enum.Font.GothamBold
	b.Parent = parent
end

local function addPlayer(player)
	local card = Instance.new("Frame")
	card.Name = player.Name
	card.Size = UDim2.new(1, -5, 0, 110)
	card.BackgroundColor3 = Color3.fromRGB(28, 28, 35)
	card.BorderSizePixel = 0
	card.Parent = scroll

	local cardCorner = Instance.new("UICorner")
	cardCorner.CornerRadius = UDim.new(0, 8)
	cardCorner.Parent = card

	local avatar = Instance.new("ImageLabel")
	avatar.Size = UDim2.new(0, 82, 0, 82)
	avatar.Position = UDim2.new(0, 10, 0, 14)
	avatar.BackgroundColor3 = Color3.fromRGB(40, 40, 48)
	avatar.BorderSizePixel = 0
	avatar.Parent = card

	local avatarCorner = Instance.new("UICorner")
	avatarCorner.CornerRadius = UDim.new(0, 10)
	avatarCorner.Parent = avatar

	task.spawn(function()
		local ok, image = pcall(function()
			return Players:GetUserThumbnailAsync(
				player.UserId,
				Enum.ThumbnailType.HeadShot,
				Enum.ThumbnailSize.Size150x150
			)
		end)

		if ok and avatar.Parent then
			avatar.Image = image
		end
	end)

	local info = Instance.new("Frame")
	info.Size = UDim2.new(1, -110, 1, -15)
	info.Position = UDim2.new(0, 105, 0, 8)
	info.BackgroundTransparency = 1
	info.Parent = card

	clickable(
		info,
		player.DisplayName,
		UDim2.new(0, 0, 0, 2),
		UDim2.new(1, -75, 0, 27),
		17,
		"Display Name"
	)

	clickable(
		info,
		"@" .. player.Name,
		UDim2.new(0, 0, 0, 33),
		UDim2.new(1, -5, 0, 24),
		14,
		"Username"
	)

	clickable(
		info,
		"User ID: " .. player.UserId,
		UDim2.new(0, 0, 0, 60),
		UDim2.new(1, -5, 0, 22),
		12,
		"User ID"
	)

	local x = 0

	if verified[player.UserId] then
		badge(
			info,
			"[☑]",
			Color3.fromRGB(60, 150, 255),
			UDim2.new(1, -70, 0, 3)
		)

		x = 40
	end

	if developers[player.UserId] then
		badge(
			info,
			"[⚒]",
			Color3.fromRGB(180, 90, 255),
			UDim2.new(1, -70 - x, 0, 3)
		)
	end
end

local function refresh()
	for _, v in ipairs(scroll:GetChildren()) do
		if v:IsA("Frame") then
			v:Destroy()
		end
	end

	for _, player in ipairs(Players:GetPlayers()) do
		addPlayer(player)
	end

	title.Text = "Players  •  " .. #Players:GetPlayers()
end

local opened = false

local function openList()
	if opened then
		return
	end

	opened = true
	main.Visible = true
	main.Position = UDim2.new(1, 20, 0, 20)

	TweenService:Create(
		main,
		TweenInfo.new(0.18, Enum.EasingStyle.Quart, Enum.EasingDirection.Out),
		{
			Position = UDim2.new(1, -450, 0, 20)
		}
	):Play()
end

local function closeList()
	if not opened then
		return
	end

	opened = false

	local t = TweenService:Create(
		main,
		TweenInfo.new(0.14, Enum.EasingStyle.Quart, Enum.EasingDirection.In),
		{
			Position = UDim2.new(1, 20, 0, 20)
		}
	)

	t:Play()

	t.Completed:Once(function()
		if not opened then
			main.Visible = false
		end
	end)
end

close.MouseButton1Click:Connect(closeList)

UserInputService.InputBegan:Connect(function(input, processed)
	if processed then
		return
	end

	if input.KeyCode == Enum.KeyCode.F2 then
		if opened then
			closeList()
		else
			openList()
		end
	elseif input.KeyCode == Enum.KeyCode.Escape then
		if popup.Visible then
			closePopup()
		elseif opened then
			closeList()
		end
	end
end)

Players.PlayerAdded:Connect(refresh)
Players.PlayerRemoving:Connect(refresh)

refresh()
`;

function copyUrl(text) {
    navigator.clipboard.writeText(text).then(function() {
        var toast = document.getElementById("toast");
        toast.classList.add("show");

        setTimeout(function() {
            toast.classList.remove("show");
        }, 3000);
    });
}

</script>

}

</body>
