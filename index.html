<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Maze V – Menu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='white'>V</text></svg>" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="menu">
        <h1>The Maze V</h1>
        <h4>[10,5% Done]</h4>
        <div class="sub">Select Your Device.</div>
        <div class="btn-group">
            <button class="btn" id="btnMobile">Mobile</button>
            <button class="btn" id="btnComputer">Computer</button>
        </div>
    </div>

    <div id="credits">
        <p id="madeby">Made By</p>
        <div id="devs-wrapper">
            <p id="fortyfourdevs">44devs</p>
            <svg id="underline-svg" viewBox="0 0 300 30" preserveAspectRatio="none">
                <path id="underline-path" d="M 0,15 Q 150,0 300,15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
            </svg>
        </div>
    </div>

    <div id="main-menu-after">
        <div id="top-bar">
            <span id="title-top">The Maze V</span>
        </div>
        <div id="menu-buttons">
            <button class="menu-btn" id="playBtn">Play</button>
            <button class="menu-btn" id="settingsBtn">Settings</button>
            <button class="menu-btn" id="creditsBtn">Credits</button>
            <button class="menu-btn" id="exitBtn">Exit</button>
        </div>
        <div id="bottom-left">By 44devs</div>
        <div id="logs-btn">Logs</div>
    </div>

    <div id="selection-overlay">
        <div class="sel-title">Settings</div>
        <button class="sel-btn sel-exit" id="selExit">← Exit</button>
        <button class="sel-btn sel-play" id="selPlay">Play →</button>
        <div class="sel-settings">
            <div class="sel-setting-row">
                <span class="label">Sanity Mode</span>
                <div class="toggle-switch on" id="sanityToggle">
                    <div class="toggle-knob"></div>
                </div>
                <span class="status on" id="sanityStatus">ON</span>
            </div>
        </div>
    </div>

    <div id="credits-overlay">
        <div id="credits-bg"></div>
        <button id="credits-exit">← Exit</button>
        <div id="credits-title">Credits</div>
        <div id="credits-scroll">
            <div id="credits-content">
                <p style="font-size:clamp(2rem,5vw,3.5rem); margin-bottom:6vh;">~ Developers ~</p>
                <p style="font-size:clamp(3.5rem,8vw,6rem); font-weight:700; letter-spacing:12px; color:#fff;">44devs</p>
                <p style="margin-top:8vh; font-size:clamp(1.2rem,2.5vw,2rem); color:#aaa;">~ Artists ~</p>
                <p style="font-size:clamp(2rem,4vw,3rem); color:#ddd; letter-spacing:4px;">Susanna Delelis</p>
                <p style="margin-top:10vh; font-size:clamp(0.8rem,1.5vw,1.2rem); color:#666;">Thank you for playing</p>
            </div>
        </div>
    </div>

    <div id="logs-overlay">
        <div id="logs-box">
            <div id="logs-header">
                <span>Logs</span>
                <button id="logs-exit">✕</button>
            </div>
            <div id="logs-content">
                <p id="logs-version">0.0.1</p>
                <p id="logs-date">Monday 7th September</p>
                <p id="logs-version">0.0.2</p>
                <p id="logs-date">Wednesday 9th September</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
