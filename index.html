
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External.net</title>
</head>
<body>

    <div class="header">
        <div class="left">External.net</div>
        <div class="right">44devs</div>
    </div>

    <div class="line"></div>

    <div class="scripts">Scripts</div>

    <div class="apps">

        <div class="app-box">
            <div class="app-title">VizLock</div>
            <button class="recive-btn" onclick="copyUrl('!Serv.Load = &quot;https://pastefy.app/RUi5Y136/raw&quot;')">Recive</button>
        </div>

        <div class="app-box">
            <div class="app-title">Catowl Icon</div>
            <button class="recive-btn" onclick="copyUrl('!Serv.Load = &quot;https://pastefy.app/6e0TjtO4/raw&quot;')">Recive</button>
        </div>

        <div class="app-box">
            <div class="app-title">Day to Night Loop</div>
            <button class="recive-btn" onclick="copyUrl(dayNightLoop)">Recive</button>
        </div>

        <div class="app-box">
            <div class="app-title">Disco</div>
            <button class="recive-btn" onclick="copyUrl(discoScript)">Recive</button>
        </div>

    </div>

    <div id="toast">
        <div class="toast-title">Code Recived</div>
        <div class="toast-desc">Paste The Copied RL In The Executor</div>
    </div>

</body>
</html>

<style>
body {
    margin: 0;
    padding: 0;
    background-image: url('https://i.pinimg.com/1200x/f3/99/6d/f3996daed70c61a4cedcfaa30c49dc27.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    color: white;
    font-family: sans-serif;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    font-size: 24px;
    font-weight: bold;
}

.line {
    height: 2px;
    background-color: white;
    width: 100%;
}

.scripts {
    font-size: 28px;
    padding: 30px;
    font-weight: bold;
}

.apps {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-left: 30px;
    margin-right: 30px;
}

.app-box {
    border: 2px solid white;
    padding: 20px 30px;
    border-radius: 10px;
    text-align: center;
    background-color: rgba(0, 0, 0, 0.4);
    transition: transform 0.3s ease, background-color 0.3s ease;
}

.app-box:hover {
    transform: translateY(-5px);
    background-color: rgba(0, 0, 0, 0.6);
}

.app-title {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.recive-btn {
    padding: 10px 20px;
    font-size: 16px;
    background-color: white;
    color: black;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: background-color 0.3s ease;
}

.recive-btn:hover {
    background-color: #aaaaaa;
}

#toast {
    position: fixed;
    top: 50%;
    left: -400px;
    transform: translateY(-50%);
    background-color: rgba(20, 20, 30, 0.95);
    color: white;
    padding: 20px 30px;
    border-radius: 10px;
    border: 2px solid white;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    transition: left 0.5s ease;
    z-index: 1000;
    min-width: 300px;
}

#toast.show {
    left: 20px;
}

.toast-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 5px;
}

.toast-desc {
    font-size: 14px;
}
</style>

<script>
const dayNightLoop = `local Lighting = game:GetService("Lighting")

local transitionTime = 30
local steps = 300

while true do
    for i = 0, steps do
        local progress = i / steps
        Lighting.ClockTime = 12 + (12 * progress)
        task.wait(transitionTime / steps)
    end

    for i = 0, steps do
        local progress = i / steps
        Lighting.ClockTime = 0 + (12 * progress)
        task.wait(transitionTime / steps)
    end
end
`;

const discoScript = `local Lighting = game:GetService("Lighting")

local colors = {
    Color3.fromRGB(140, 60, 0),
    Color3.fromRGB(255, 0, 0),
    Color3.fromRGB(255, 0, 255),
    Color3.fromRGB(0, 0, 255),
    Color3.fromRGB(0, 255, 255),
    Color3.fromRGB(0, 255, 0),
    Color3.fromRGB(255, 255, 0)
}

while true do
    for _, color in ipairs(colors) do
        Lighting.Ambient = color
        Lighting.OutdoorAmbient = color
        task.wait(0.5)
    end
end
`;

function copyUrl(code) {
    navigator.clipboard.writeText(code).then(function() {
        var toast = document.getElementById("toast");

        toast.classList.add("show");

        setTimeout(function() {
            toast.classList.remove("show");
        }, 3000);
    }).catch(function(error) {
        console.error("Copy failed:", error);
    });
}
</script>
